<!DOCTYPE html>
<html>
<head>
    <title>Arras.io Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background: #b9b9b9; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
        .bar-bg { width: 300px; height: 15px; background: #555; border: 2px solid #333; }
        #bar-fill { width: 0%; height: 100%; background: #00b2e1; transition: width 0.1s; }
        #stats { color: white; text-shadow: 1px 1px 2px black; margin-bottom: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="stats">Lvl 0 Tank | Score: 0</div>
        <div class="bar-bg"><div id="bar-fill"></div></div>
    </div>
    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stats = document.getElementById('stats');
const bar = document.getElementById('bar-fill');

let score = 0;
let level = 0;
const maxScore = 26000;
const maxLevel = 45;

const player = {
    x: 0, y: 0,
    radius: 10, // Base radius
    angle: 0,
    speed: 4
};

const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('mousemove', e => {
    player.angle = Math.atan2(e.clientY - canvas.height/2, e.clientX - canvas.width/2);
});

// Gain score automatically for demo purposes
setInterval(() => {
    if (score < maxScore) {
        score += 50;
        level = Math.min(maxLevel, Math.floor((score / maxScore) * maxLevel));
        updateUI();
    }
}, 100);

function updateUI() {
    stats.innerText = `Lvl ${level} Tank | Score: ${score.toLocaleString()}`;
    bar.style.width = (score / maxScore * 100) + "%";
}

function drawGrid(ox, oy) {
    const size = 50;
    ctx.strokeStyle = '#a0a0a0';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = -ox % size; x < canvas.width; x += size) {
        ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
    }
    for (let y = -oy % size; y < canvas.height; y += size) {
        ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
    }
    ctx.stroke();
}

function loop() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Movement
    if (keys['KeyW']) player.y -= player.speed;
    if (keys['KeyS']) player.y += player.speed;
    if (keys['KeyA']) player.x -= player.speed;
    if (keys['KeyD']) player.x += player.speed;

    // Draw Map
    drawGrid(player.x, player.y);

    // Calculate Dynamic Size (from tiny to big)
    const currentRadius = 10 + (level * 0.8);

    // Draw Tank
    ctx.save();
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(player.angle);

    // Barrel
    ctx.fillStyle = '#999';
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.fillRect(0, -currentRadius/1.5, currentRadius * 1.8, currentRadius * 1.3);
    ctx.strokeRect(0, -currentRadius/1.5, currentRadius * 1.8, currentRadius * 1.3);

    // Body
    ctx.fillStyle = '#00b2e1';
    ctx.beginPath();
    ctx.arc(0, 0, currentRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
