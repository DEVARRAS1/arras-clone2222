<!DOCTYPE html>
<html>
<head>
    <title>Arras.io Prototype</title>
    <style>
        body { margin: 0; overflow: hidden; background: #b9b9b9; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
        .bar-bg { width: 300px; height: 12px; background: #555; border: 2px solid #333; border-radius: 10px; overflow: hidden; }
        #bar-fill { width: 0%; height: 100%; background: #00b2e1; transition: width 0.2s; }
        #stats { color: white; text-shadow: 1px 1px 2px black; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="stats">Lvl 0 Tank | Score: 0</div>
        <div class="bar-bg"><div id="bar-fill"></div></div>
    </div>
    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stats = document.getElementById('stats');
const bar = document.getElementById('bar-fill');

let score = 0;
let level = 0;
const maxScore = 26000;
const maxLevel = 45;

const player = {
    x: 0, y: 0,
    vx: 0, vy: 0,
    radius: 12,
    angle: 0,
    accel: 0.3,
    friction: 0.92,
    maxSpeed: 2.5,
    lastShot: 0,
    reload: 350,
    // Spring Physics for Recoil
    recoilPos: 0,
    recoilVel: 0
};

let bullets = [];
const keys = {};

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyN') { score = maxScore; updateStats(); }
});
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('mousedown', () => keys['Mouse0'] = true);
window.addEventListener('mouseup', () => keys['Mouse0'] = false);
window.addEventListener('mousemove', e => {
    player.angle = Math.atan2(e.clientY - canvas.height/2, e.clientX - canvas.width/2);
});

function updateStats() {
    level = Math.min(maxLevel, Math.floor((score / maxScore) * maxLevel));
    stats.innerText = `Lvl ${level} Tank | Score: ${score.toLocaleString()}`;
    bar.style.width = (score / maxScore * 100) + "%";
}

function shoot() {
    const now = Date.now();
    if (now - player.lastShot > player.reload) {
        const currentRadius = 12 + (level * 0.7);
        const barrelW = currentRadius * 0.9;
        const barrelL = currentRadius * 1.9;
        
        bullets.push({
            x: player.x + Math.cos(player.angle) * barrelL,
            y: player.y + Math.sin(player.angle) * barrelL,
            vx: Math.cos(player.angle) * 9,
            vy: Math.sin(player.angle) * 9,
            life: 80 + (level * 2.5), 
            radius: barrelW / 2 
        });

        // Jerk the recoil velocity back hard
        player.recoilVel -= 12; 
        
        // Physical knockback
        player.vx -= Math.cos(player.angle) * 0.6;
        player.vy -= Math.sin(player.angle) * 0.6;
        
        player.lastShot = now;
    }
}

function loop() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    if (keys['KeyW']) player.vy -= player.accel;
    if (keys['KeyS']) player.vy += player.accel;
    if (keys['KeyA']) player.vx -= player.accel;
    if (keys['KeyD']) player.vx += player.accel;
    if (keys['Mouse0']) shoot();

    player.vx *= player.friction;
    player.vy *= player.friction;
    player.x += player.vx;
    player.y += player.vy;

    // --- Spring Math ---
    let springK = 0.15; // Stiffness
    let damping = 0.8;  // Friction for the spring
    let force = -springK * player.recoilPos; 
    player.recoilVel += force;
    player.recoilVel *= damping;
    player.recoilPos += player.recoilVel;

    const zoom = 1 / (1 + (level * 0.012)); 
    ctx.save();
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.scale(zoom, zoom);
    ctx.translate(-player.x, -player.y);

    // Grid
    const gridSize = 50;
    ctx.strokeStyle = '#a8a8a8';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = player.x - (canvas.width/zoom); x < player.x + (canvas.width/zoom); x += gridSize) {
        let dX = Math.floor(x / gridSize) * gridSize;
        ctx.moveTo(dX, player.y - (canvas.height/zoom));
        ctx.lineTo(dX, player.y + (canvas.height/zoom));
    }
    for (let y = player.y - (canvas.height/zoom); y < player.y + (canvas.height/zoom); y += gridSize) {
        let dY = Math.floor(y / gridSize) * gridSize;
        ctx.moveTo(player.x - (canvas.width/zoom), dY);
        ctx.lineTo(player.x + (canvas.width/zoom), dY);
    }
    ctx.stroke();

    // Bullets
    bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy; b.life--;
        ctx.fillStyle = '#00b2e1';
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        if (b.life <= 0) bullets.splice(i, 1);
    });

    // Tank Drawing
    const currentRadius = 12 + (level * 0.7);
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    
    // Barrel (Uses smooth spring position)
    ctx.fillStyle = '#999';
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 3;
    const barrelW = currentRadius * 0.9;
    const barrelL = currentRadius * 1.9;
    // Barrel length is modified by the recoilPos (negative value)
    ctx.fillRect(0, -barrelW/2, barrelL + player.recoilPos, barrelW);
    ctx.strokeRect(0, -barrelW/2, barrelL + player.recoilPos, barrelW);

    // Body (Jerks back slightly with barrel)
    ctx.save();
    ctx.translate(player.recoilPos * 0.3, 0); 
    ctx.fillStyle = '#00b2e1';
    ctx.strokeStyle = '#008ba8';
    ctx.beginPath();
    ctx.arc(0, 0, currentRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    ctx.restore();
    ctx.restore();

    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
