<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Arras.io Recreation</title>
  <style>
    body { margin:0; background:#0a0a0a; overflow:hidden; font-family:Arial; }
    canvas { display:block; margin:0 auto; image-rendering:pixelated; }
    #ui { position:absolute; top:10px; left:10px; color:#0f0; pointer-events:none; z-index:10; }
    #upgrades { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:10; }
    button { padding:12px 18px; background:#111; color:#0f0; border:2px solid #0f0; font-size:16px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="ui">
    <h2>My Arras</h2>
    <p>Level: <span id="level">1</span> | Score: <span id="score">0</span> | Kills: <span id="kills">0</span></p>
  </div>

  <div id="upgrades"></div>
  <canvas id="game" width="1100" height="700"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    
    let player = { x: 550, y: 350, size: 22, speed: 5.2, angle: 0, level: 1, score: 0, kills: 0, tankType: "Basic" };
    let bullets = [];
    let shapes = [];
    let enemies = [];
    let keys = {};

    for(let i = 0; i < 28; i++) {
      shapes.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: 17, type: Math.random() > 0.65 ? "big" : "normal", color: "#ff0" });
    }
    for(let i = 0; i < 8; i++) spawnEnemy();

    function spawnEnemy() {
      enemies.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: 21, speed: 2.8, health: 4 });
    }

    canvas.addEventListener("mousemove", e => {
      const rect = canvas.getBoundingClientRect();
      player.angle = Math.atan2(e.clientY - rect.top - player.y, e.clientX - rect.left - player.x);
    });

    canvas.addEventListener("click", () => {
      const speed = player.tankType === "Sniper" ? 13 : player.tankType === "Twin" ? 10 : 9;
      bullets.push({ x: player.x, y: player.y, vx: Math.cos(player.angle)*speed, vy: Math.sin(player.angle)*speed, size: 8.5, life: 65 });
    });

    window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
    window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

    window.upgradeTank = function(type) {
      player.tankType = type;
      document.getElementById("upgrades").innerHTML = `<h3 style="color:#0f0">Now using: ${type}</h3>`;
    };

    function showUpgrades() {
      const div = document.getElementById("upgrades");
      div.innerHTML = `
        <button onclick="upgradeTank('Twin')">Twin</button>
        <button onclick="upgradeTank('Sniper')">Sniper</button>
        <button onclick="upgradeTank('Machine')">Machine Gun</button>
      `;
    }

    function update() {
      if (keys['w'] || keys['arrowup']) player.y -= player.speed;
      if (keys['s'] || keys['arrowdown']) player.y += player.speed;
      if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
      if (keys['d'] || keys['arrowright']) player.x += player.speed;

      player.x = Math.max(30, Math.min(canvas.width-30, player.x));
      player.y = Math.max(30, Math.min(canvas.height-30, player.y));

      for(let i = bullets.length-1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx; b.y += b.vy; b.life--;
        if (b.life <= 0) bullets.splice(i,1);
      }

      // Shape collisions
      for(let i = shapes.length-1; i >= 0; i--) {
        let s = shapes[i];
        for(let j = bullets.length-1; j >= 0; j--) {
          let b = bullets[j];
          if (Math.hypot(s.x - b.x, s.y - b.y) < s.size + b.size) {
            shapes.splice(i,1);
            bullets.splice(j,1);
            player.score += s.type === "big" ? 30 : 12;
            if (player.score > player.level * 140) {
              player.level++;
              if (player.level === 6) showUpgrades();
            }
            shapes.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: 17, type: Math.random() > 0.65 ? "big" : "normal", color: "#ff0" });
            break;
          }
        }
      }

      // Enemy logic
      for(let i = enemies.length-1; i >= 0; i--) {
        let e = enemies[i];
        let dx = player.x - e.x, dy = player.y - e.y;
        let dist = Math.hypot(dx, dy);
        if (dist > 10) {
          e.x += (dx/dist) * e.speed;
          e.y += (dy/dist) * e.speed;
        }
        for(let j = bullets.length-1; j >= 0; j--) {
          let b = bullets[j];
          if (Math.hypot(e.x - b.x, e.y - b.y) < e.size + b.size) {
            e.health--;
            bullets.splice(j,1);
            if (e.health <= 0) {
              player.kills++;
              player.score += 60;
              enemies.splice(i,1);
              spawnEnemy();
            }
            break;
          }
        }
      }
    }

    function draw() {
      ctx.fillStyle = "#0f0f0f";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = "#1f1f1f";
      for(let x=0; x<canvas.width; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
      for(let y=0; y<canvas.height; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

      // Shapes
      for(let s of shapes) {
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
        ctx.fill();
      }

      // Enemies
      ctx.fillStyle = "#f33";
      for(let e of enemies) {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(Math.atan2(player.y - e.y, player.x - e.x));
        ctx.fillRect(-e.size, -e.size/1.8, e.size*2.1, e.size*1.2);
        ctx.restore();
      }

      // Player
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);
      ctx.fillStyle = "#0f0";
      ctx.fillRect(-player.size, -player.size/2, player.size*2, player.size);

      ctx.fillStyle = "#0a0";
      if (player.tankType === "Twin") {
        ctx.fillRect(player.size-10,
